name: godot-lens

# Project health for Godot repositories, with no agent and no LLM involved.
#
# This is the job that makes the tooling useful to people who never run an AI:
# it turns "the project is broken" into a failing check with a structured
# finding, on the pull request, before merge.
#
# Two things are deliberately explicit here because a green pipeline is trusted,
# and these are the ways this pipeline could go green while being wrong.
#
# This workflow is written for a game repository that has godot-lens cloned
# inside it (`your-game/godot-lens/`), which is how README.md says to install it.
# In godot-lens's OWN repository the kit is the checkout root, so a hardcoded
# `godot-lens/` prefix resolves to the `godot-lens` *script file* rather than a
# directory: every step died with "Not a directory" and the run went red on every
# push. The kit root is now resolved once, below, so both layouts work.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  # Godot needs writable config/data directories. Without them it aborts with a
  # bare `signal 11`, which reads as an engine crash rather than a permissions
  # problem. Keeping them inside the workspace also keeps runs reproducible.
  GODOT_LENS_HOME: ${{ github.workspace }}/.lensstate
  GODOT_VERSION: "4.5.1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o /tmp/godot.zip "${base}/${GODOT_VERSION}-stable/${file}.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/${file}" /usr/local/bin/godot
          godot --version

      - name: Locate the kit and the Godot project
        run: |
          set -euo pipefail

          # Which layout are we in? Kit inside a game repo, or the kit's own repo.
          if [ -d godot-lens/tools ]; then kit=godot-lens; else kit=.; fi
          echo "KIT=$kit" >> "$GITHUB_ENV"
          echo "kit: $kit"

          if [ -n "${GODOT_PROJECT:-}" ]; then
            echo "project (from GODOT_PROJECT): $GODOT_PROJECT"
            exit 0
          fi

          # Never guess: a wrong-but-plausible project makes every later result
          # describe something nobody asked about. `find` is therefore only used
          # in the consumer layout, where the answer genuinely is "wherever the
          # game is". In the kit's own repository it would pick a scratch or
          # fixture project depending on directory order, so the target is named
          # outright instead.
          if [ "$kit" = "." ]; then
            # The kit's own repository ships no game. Validate the bundled
            # fixture rather than skipping: it is a real Godot project, so the
            # engine-facing half of this pipeline still runs, and skipping would
            # let that half rot unnoticed.
            found="${kit}/experiments/agent-ab/projects/hud"
            [ -d "$found" ] && echo "::notice::no game project here; validating the bundled fixture at ${found}"
          else
            found="$(find . -name project.godot -not -path './.git/*' \
                       -not -path "./${kit}/*" -printf '%h\n' | head -1)"
          fi

          if [ -z "${found:-}" ] || [ ! -f "${found}/project.godot" ]; then
            echo "::error::no project.godot found in this repository"
            exit 1
          fi
          echo "GODOT_PROJECT=${found}" >> "$GITHUB_ENV"
          echo "project: ${found}"

      - name: Build the engine API reference
        run: |
          set -euo pipefail
          # Generated from the installed binary, so it cannot disagree with the
          # engine actually running.
          bash "$KIT/tools/godot_api.sh" dump

      - name: Validate (static / scene / runtime)
        run: |
          set -euo pipefail
          # --json emits one object per finding, so results can be annotated onto
          # the diff instead of scraped out of a log.
          bash "$KIT/tools/godot_validate.sh" --json | tee /tmp/validate.txt

      - name: Annotate findings on the diff
        if: always()
        run: |
          set -euo pipefail
          [ -f /tmp/validate.txt ] || exit 0
          python3 "$KIT/benchmarks/annotate.py" /tmp/validate.txt

      - name: Verify the graders themselves
        run: |
          set -euo pipefail
          # A benchmark that can pass a broken project manufactures confidence,
          # so its own correctness is part of this pipeline rather than a local
          # nicety.
          python3 "$KIT/benchmarks/selftest.py"
          python3 "$KIT/benchmarks/study_selftest.py"

      - name: Verify the renderers
        run: |
          set -euo pipefail
          # Needs no Godot and no project: the renderers are pure functions of a
          # frozen payload, which is what makes the awkward inputs (a project that
          # cannot boot, a malformed field) testable at all.
          python3 "$KIT/benchmarks/render_selftest.py"

      - name: Measure observability coverage
        run: |
          set -euo pipefail
          # Which fault classes can the tooling see at all, and how many false
          # positives does it raise on a healthy project. Exits non-zero only if a
          # class behaves differently from the registry: a documented blind spot
          # being missed is a pass, because the measurement agreeing with the
          # documented limit is the point.
          python3 "$KIT/benchmarks/coverage.py"
